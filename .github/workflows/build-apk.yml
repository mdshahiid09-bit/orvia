name: Build APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7 Binary & Generate Wrapper
        run: |
          echo "Downloading Gradle 8.7 distribution..."
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle-dist.zip
          unzip -q gradle-dist.zip
          ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          rm -rf gradle-dist.zip gradle-8.7
          ls -la gradle/wrapper/

      - name: Run Unit Tests
        run: |
          ./gradlew test --stacktrace 2>&1 | tee test_output.log

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log

      - name: Verify Debug APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Debug APK was not generated at expected location!"
            exit 1
          fi
          echo "Debug APK built successfully at app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orvia-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          TAG_NAME="v${VERSION_NAME}"
          echo "Target Release Tag: $TAG_NAME"

          APK_RELEASE_NAME="Orvia-${TAG_NAME}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_RELEASE_NAME"

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Uploading/clobbering asset..."
            gh release upload "$TAG_NAME" "$APK_RELEASE_NAME" --clobber
          else
            echo "Creating new GitHub Release $TAG_NAME..."
            cat << 'EOF' > release_notes.md
          ## Orvia Android Chat + Builder + Master Prompt Generator

          ### What's New
          - **Three Modes**: Ask Anything, Builder (App & Website), and Master Prompt Generator.
          - **AI Providers**: Google Gemini, Groq, OpenRouter, and Unlimited Custom OpenAI-compatible endpoints with real live API calling.
          - **Streaming**: Typing effect with word-by-word streaming, thinking timer, markdown, and syntax-highlighted code blocks.
          - **Adaptive Questioning**: 12 to 20 live adaptive questions for Builder and Master Prompt interviews.
          - **Project Tools**: File tree viewer, zip export, red/green diff editor, undo history, and GitHub direct repo push.
          - **Encrypted Storage**: Secure API key & GitHub token storage backed by Android Keystore.
          - **Widget**: Home screen widget for one-tap new chat.
          EOF
            gh release create "$TAG_NAME" "$APK_RELEASE_NAME" \
              --title "Orvia $TAG_NAME" \
              --notes-file release_notes.md
          fi

      - name: Report Error on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat << 'EOF' > error_report.md
          ## CI Build / Test Failure

          ### Test Output (last 200 lines):
          ```
          EOF
          if [ -f test_output.log ]; then tail -n 200 test_output.log >> error_report.md; fi
          cat << 'EOF' >> error_report.md
          ```

          ### Build Output (last 200 lines):
          ```
          EOF
          if [ -f build_output.log ]; then tail -n 200 build_output.log >> error_report.md; fi
          cat << 'EOF' >> error_report.md
          ```
          EOF
          gh issue create --title "CI Build Failure Log" --body-file error_report.md || true
